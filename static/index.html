<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>agent-ui</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="app">
      <!-- ============ session list ============ -->
      <section id="view-list" class="view">
        <header class="topbar">
          <div class="brand">
            <h1>agent-ui</h1>
            <p id="session-count" class="muted"></p>
          </div>
          <button id="btn-new" class="btn btn-primary" type="button">+ New</button>
        </header>
        <div id="session-list" class="session-list"></div>
      </section>

      <!-- ============ session view ============ -->
      <section id="view-session" class="view hidden">
        <header class="session-header">
          <button id="btn-back" class="icon-btn" type="button" aria-label="Back">‹</button>
          <div class="session-headings">
            <h1 id="session-title"></h1>
            <p id="session-dir" class="muted mono"></p>
          </div>
          <span id="session-status" class="status-badge idle">idle</span>
          <button id="btn-kill" class="btn btn-danger hidden" type="button">Stop</button>
        </header>

        <div id="transcript" class="transcript" aria-live="polite"></div>

        <footer class="composer-shell">
          <div id="activity" class="activity hidden"></div>
          <form id="composer" class="composer">
            <textarea
              id="prompt-input"
              rows="1"
              placeholder="Message the agent…"
              autocomplete="off"
            ></textarea>
            <button id="btn-send" class="btn btn-primary send" type="submit" aria-label="Send">↑</button>
          </form>
        </footer>
      </section>
    </main>

    <!-- ============ new session dialog ============ -->
    <dialog id="dialog-new">
      <form id="form-new" method="dialog" class="modal">
        <header class="modal-head">
          <h2>New session</h2>
          <button id="btn-close-dialog" class="icon-btn" type="button" aria-label="Close">×</button>
        </header>

        <label>
          Name
          <input id="input-name" name="name" required maxlength="120" placeholder="my-project">
        </label>

        <label>
          Working directory
          <input id="input-dir" name="working_dir" required value="/projects/" class="mono">
        </label>

        <label>
          Agent
          <select id="select-agent" name="agent">
            <option value="claude-code">Claude Code</option>
          </select>
        </label>

        <button class="btn btn-primary full-width" type="submit">Create session</button>
      </form>
    </dialog>

    <script src="/static/app.js" defer></script>
  </body>
</html>
