// Release versioning, applied from app/build.gradle.
//
// `make release` passes -PreleaseVersionCode=<n>. Release builds then get
// versionCode <n> and versionName "<defaultConfig.versionName>.<n>". Debug
// builds are unaffected. Gradle only produces an unsigned APK: signing happens
// afterwards in a separate offline container, so build logic never sees the
// key. See RELEASING.md.

def releaseVersionCode = findProperty('releaseVersionCode')

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        if (releaseVersionCode != null) {
            def code = releaseVersionCode as int
            variant.outputs.each { output ->
                output.versionCode.set(code)
                output.versionName.set("${android.defaultConfig.versionName}.${code}".toString())
            }
        }
    }
}

def checkReleaseVersion = tasks.register('checkReleaseVersion') {
    doLast {
        if (!(releaseVersionCode ==~ /[1-9][0-9]*/)) {
            throw new GradleException('Release builds need -PreleaseVersionCode=<positive integer>. ' +
                'Build releases with `make release` (see RELEASING.md).')
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn checkReleaseVersion
}
